name: Deploy GitHub Pages

on:
  workflow_dispatch:
    inputs:
      mrbs_code_tag:
        description: Tag to import from mrbs-code (for example, v1.12.2)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out application documentation
        uses: actions/checkout@v4
        with:
          repository: meeting-room-booking-system/mrbs-code
          ref: refs/tags/${{ inputs.mrbs_code_tag }}
          path: upstream/mrbs-code
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Import upstream documentation
        run: python3 scripts/import_upstream_docs.py upstream/mrbs-code site

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4