name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      mrbs_code_tag:
        description: Optional tag to import (for example, v1.12.2); leave both inputs empty for the latest release tag
        required: false
        default: ''
        type: string
      mrbs_code_branch:
        description: Optional branch to import (for example, main); leave both inputs empty for the latest release tag
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run tests
        run: python3 -m unittest discover -s tests

      - name: Resolve mrbs-code ref
        id: ref
        env:
          TAG: ${{ inputs.mrbs_code_tag }}
          BRANCH: ${{ inputs.mrbs_code_branch }}
        run: |
          if [[ -n "$TAG" && ! "$TAG" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ -n "$BRANCH" && ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::mrbs_code_tag and mrbs_code_branch may only contain letters, digits, '.', '_', '/' and '-'."
            exit 1
          fi
          if [ -n "$TAG" ] && [ -n "$BRANCH" ]; then
            echo "::error::Provide at most one of mrbs_code_tag or mrbs_code_branch."
            exit 1
          elif [ -n "$TAG" ]; then
            ref="refs/tags/$TAG"
          elif [ -n "$BRANCH" ]; then
            ref="refs/heads/$BRANCH"
          else
            ref=$(git ls-remote --tags --refs --sort=-v:refname \
              https://github.com/meeting-room-booking-system/mrbs-code 'v[0-9]*' \
              | sed -n '1s/.*\t//p')
            if [ -z "$ref" ]; then
              echo "::error::No release tag found in mrbs-code."
              exit 1
            fi
          fi
          echo "Importing documentation from $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out application documentation
        uses: actions/checkout@v7
        with:
          repository: meeting-room-booking-system/mrbs-code
          ref: ${{ steps.ref.outputs.ref }}
          path: upstream/mrbs-code
          persist-credentials: false

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Import upstream documentation
        run: python3 scripts/import_upstream_docs.py upstream/mrbs-code site

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
